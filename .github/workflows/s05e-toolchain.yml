name: S05-E isolated toolchain reproduction
on:
  workflow_dispatch:
  push:
    branches: [codex/s05-e-native-rebuild-compliance]
    paths:
      - .github/workflows/s05e-toolchain.yml
      - scripts/prepare_s05e_toolchain.py
      - scripts/capture_s05e_toolchain.py
      - docker/s05e-toolchain.Dockerfile
      - docs/evidence/s05e/historical-rpm-files.json
      - docs/evidence/s05e/python-input-hashes.json
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Acquire frozen signed RPM and hash-pinned Python/Rust/Cargo source inputs
        run: python3 scripts/prepare_s05e_toolchain.py --out "$RUNNER_TEMP/s05e-inputs"
      - name: Reacquire nine sources and verify exact original AUTHORS notices
        run: |
          python3 scripts/s05e_rust_notices.py --out "$RUNNER_TEMP/s05e-notices" --cache "$RUNNER_TEMP/s05e-crates"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'s05e-notices/rust-notice-resolution.json').read_text())
          assert r['counts']=={'PASS':2,'BLOCKED':7,'UNKNOWN':0,'NOT_APPLICABLE':0}
          assert all(x['archiveSha256']==x['cargoChecksum'] for x in r['records'])
          assert r['legalApproval'] is False
          PY
      - name: Recreate original sysroot offline
        run: |
          docker build --network=none -t s05e-toolchain-historical "$RUNNER_TEMP/s05e-inputs/context" > "$RUNNER_TEMP/toolchain-build.log" 2>&1
          docker image inspect s05e-toolchain-historical --format '{{.Id}}' > "$RUNNER_TEMP/config-id.txt"
      - name: Bootstrap exact cargo-c offline with bounded resources
        run: |
          docker run --name s05e-cargo-c-historical --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --user "$(id -u):$(id -g)" --memory=6g --cpus=2 --pids-limit=512 --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            -v "$RUNNER_TEMP/s05e-inputs/rust/toolchain:/rust:ro" -v "$RUNNER_TEMP/s05e-inputs/rust/cargo-c-source:/source:ro" -v "$RUNNER_TEMP/s05e-inputs:/out:rw" \
            -e PATH=/rust/bin:/opt/rh/gcc-toolset-15/root/usr/bin:/opt/s05e/bin:/usr/local/bin:/usr/bin:/bin -e CARGO_HOME=/out/cargo-cache -e HOME=/out/cargo-home -e CARGO_TARGET_DIR=/out/cargo-c-historical-target -e CARGO_BUILD_JOBS=2 \
            s05e-toolchain-historical timeout --signal=TERM --kill-after=10s 1500 cargo install --offline --locked --path /source --root /out/cargo-c-historical-install > "$RUNNER_TEMP/cargo-c-build.log" 2>&1
      - name: Measure actual tools and compare with Cloud source experiment inputs
        run: |
          python3 scripts/capture_s05e_toolchain.py --inputs "$RUNNER_TEMP/s05e-inputs" --out "$RUNNER_TEMP/s05e-evidence" --image "$(cat "$RUNNER_TEMP/config-id.txt")"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'s05e-evidence'
          expected=json.load(open('docs/evidence/s05e/measured-tools.json'))
          actual={r['name']:r for r in json.loads((root/'measured-tools.json').read_text())}
          mismatch=[r['name'] for r in expected if actual.get(r['name'],{}).get('sha256')!=r['sha256']]
          old=json.load(open('docs/evidence/s05e/toolchain.json'))['cargoCBootstrap']
          new=json.loads((root/'toolchain.json').read_text())['cargoCBootstrap']
          if {Path(r['file']).name:r['sha256'] for r in old['executables']}!={Path(r['file']).name:r['sha256'] for r in new['executables']}:mismatch.append('cargo-c executables')
          result={'toolBytesRepeat':not mismatch,'mismatch':mismatch,'scope':'controlled toolchain binaries, not historical image byte identity','binaryDistributionReadiness':'BLOCKED','legalApproval':False}
          (root/'reproduction-result.json').write_text(json.dumps(result,indent=2)+'\n')
          if mismatch:raise SystemExit(1)
          PY
      - name: Retain actual successful or failed experiment (development evidence only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s05e-toolchain-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/toolchain-build.log
            ${{ runner.temp }}/cargo-c-build.log
            ${{ runner.temp }}/config-id.txt
            ${{ runner.temp }}/s05e-evidence
            ${{ runner.temp }}/s05e-inputs/input-acquisition.json
            ${{ runner.temp }}/s05e-inputs/cargo-fetch.log
            ${{ runner.temp }}/s05e-inputs/cargo-c-historical-install/bin
            ${{ runner.temp }}/s05e-notices
            ${{ runner.temp }}/s05e-crates

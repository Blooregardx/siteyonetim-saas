name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: siteyonetim
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: siteyonetim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U siteyonetim -d siteyonetim_test"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://siteyonetim:localdev@localhost:5432/siteyonetim_test?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://siteyonetim:localdev@localhost:5432/siteyonetim_test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://siteyonetim:localdev@localhost:5432/siteyonetim_test?schema=public

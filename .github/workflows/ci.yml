name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: siteyonetim
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: siteyonetim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U siteyonetim -d siteyonetim_test"
          --health-interval 5s --health-timeout 5s --health-retries 5
      postgres_restore:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: siteyonetim
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: siteyonetim_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U siteyonetim -d siteyonetim_test"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://siteyonetim:localdev@localhost:5432/siteyonetim_test?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: python3 scripts/verify-source-readiness.py
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://siteyonetim:localdev@localhost:5432/siteyonetim_test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          F10_DIAGNOSTICS: '1'
          TEST_DATABASE_URL: postgresql://siteyonetim:localdev@localhost:5432/siteyonetim_test?schema=public

      - run: npx tsx scripts/verify-dashboard-query-plan.ts
        env:
          TEST_DATABASE_URL: postgresql://siteyonetim:localdev@localhost:5432/siteyonetim_test?schema=public

      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_backup_stream.py

      - name: Synthetic backup and restore drill
        env:
          TEST_DATABASE_URL: postgresql://siteyonetim:localdev@localhost:5432/siteyonetim_test?schema=public
          OSS_TEST_SOURCE_CONTAINER: ${{ job.services.postgres.id }}
          OSS_TEST_RESTORE_CONTAINER: ${{ job.services.postgres_restore.id }}
        run: |
          npx tsx scripts/recovery-probe.ts create "$RUNNER_TEMP/recovery-fixture.json"
          # pg_dump carries ACLs, not global roles; pre-create the synthetic role.
          docker exec "$OSS_TEST_SOURCE_CONTAINER" psql -U siteyonetim -d siteyonetim_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE s03f_restore_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE; GRANT USAGE ON SCHEMA public TO s03f_restore_runtime; GRANT SELECT ON "Payment","PaymentReversal","FinancialEntry","FinancialEntryReversal" TO s03f_restore_runtime; GRANT SELECT (id) ON "AuditLog" TO s03f_restore_runtime; GRANT UPDATE (id) ON "Payment" TO s03f_restore_runtime;'
          docker exec "$OSS_TEST_RESTORE_CONTAINER" psql -U siteyonetim -d siteyonetim_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE s03f_restore_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;'
          python3 scripts/verify-backup-restore.py
          DATABASE_URL=postgresql://siteyonetim:localdev@127.0.0.1:5433/siteyonetim_test?schema=public TEST_DATABASE_URL=postgresql://siteyonetim:localdev@127.0.0.1:5433/siteyonetim_test?schema=public npx tsx scripts/recovery-probe.ts verify "$RUNNER_TEMP/recovery-fixture.json"

  selfhost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: siteyonetim_test
      APP_URL: https://example.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sh scripts/test-selfhost.sh

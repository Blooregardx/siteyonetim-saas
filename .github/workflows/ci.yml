name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: siteyonetim
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: siteyonetim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U siteyonetim -d siteyonetim_test"
          --health-interval 5s --health-timeout 5s --health-retries 5
      postgres_restore:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: siteyonetim
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: siteyonetim_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U siteyonetim -d siteyonetim_test"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://siteyonetim:localdev@localhost:5432/siteyonetim_test?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: python3 scripts/verify-source-readiness.py
      - name: Read-only preflight and source archive policy tests
        run: python3 scripts/test_preflight.py && python3 scripts/test_distribution.py && python3 scripts/test_distribution_gate.py && python3 scripts/test_libvips_sources.py && python3 scripts/test_libvips_rebuild.py && python3 scripts/test_s05d_evidence.py
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://siteyonetim:localdev@localhost:5432/siteyonetim_test
      - run: node --test docker/collect-notices.test.mjs docker/elf-evidence.test.mjs
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          F10_DIAGNOSTICS: '1'
          TEST_DATABASE_URL: postgresql://siteyonetim:localdev@localhost:5432/siteyonetim_test?schema=public

      - run: npx tsx scripts/verify-dashboard-query-plan.ts
        env:
          TEST_DATABASE_URL: postgresql://siteyonetim:localdev@localhost:5432/siteyonetim_test?schema=public

      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_backup_stream.py

      - name: Synthetic backup and restore drill
        env:
          TEST_DATABASE_URL: postgresql://siteyonetim:localdev@localhost:5432/siteyonetim_test?schema=public
          OSS_TEST_SOURCE_CONTAINER: ${{ job.services.postgres.id }}
          OSS_TEST_RESTORE_CONTAINER: ${{ job.services.postgres_restore.id }}
        run: |
          npx tsx scripts/recovery-probe.ts create "$RUNNER_TEMP/recovery-fixture.json"
          # pg_dump carries ACLs, not global roles; pre-create the synthetic role.
          docker exec "$OSS_TEST_SOURCE_CONTAINER" psql -U siteyonetim -d siteyonetim_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE s03f_restore_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE; GRANT USAGE ON SCHEMA public TO s03f_restore_runtime; GRANT SELECT ON "Payment","PaymentReversal","FinancialEntry","FinancialEntryReversal" TO s03f_restore_runtime; GRANT SELECT (id) ON "AuditLog" TO s03f_restore_runtime; GRANT UPDATE (id) ON "Payment" TO s03f_restore_runtime;'
          docker exec "$OSS_TEST_RESTORE_CONTAINER" psql -U siteyonetim -d siteyonetim_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE s03f_restore_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;'
          python3 scripts/verify-backup-restore.py
          DATABASE_URL=postgresql://siteyonetim:localdev@127.0.0.1:5433/siteyonetim_test?schema=public TEST_DATABASE_URL=postgresql://siteyonetim:localdev@127.0.0.1:5433/siteyonetim_test?schema=public npx tsx scripts/recovery-probe.ts verify "$RUNNER_TEMP/recovery-fixture.json"

  selfhost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: siteyonetim_test
      APP_URL: https://example.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install host-only open source encryption tool
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Clean public GitHub checkout, source archive, Docker and encrypted recovery
        env:
          CLEAN_INSTALL_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/clean_install_ci.py --revision "$CLEAN_INSTALL_REVISION"
      - name: Preserve image compliance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s05a-image-evidence-${{ github.event_name }}
          path: ${{ runner.temp }}/s05a-evidence
          if-no-files-found: error

  rebuild-experiment:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/s05-c-')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reverify Rust candidate source bytes and preserve a bounded source bundle
        run: |
          python3 scripts/research_rust_sources.py
          python3 - <<'PYCODE'
          import hashlib,json,os,tarfile
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          from verify_libvips_rebuild import verify_sources
          manifest=json.load(open('docs/evidence/s05c/rust-source-manifest.json'))
          print(json.dumps(verify_sources(manifest,Path('docs/evidence/s05c'),Path('/tmp/s05c-crates'))))
          with tarfile.open(Path(os.environ['RUNNER_TEMP'])/'s05c-rust-sources.tar.gz','w:gz') as archive:
              for r in manifest['records']:
                  if r.get('archiveIntegrity')!='PASS':continue
                  p=Path('/tmp/s05c-crates')/(r['name']+'-'+r['version']+'.crate')
                  if p.is_symlink() or hashlib.sha256(p.read_bytes()).hexdigest()!=r['archiveSha256']:raise ValueError('CACHE_HASH')
                  archive.add(p,arcname=p.name,recursive=False)
          PYCODE
      - name: Controlled Cargo resolution (not compilation)
        run: python3 scripts/capture_rust_metadata.py
      - name: Actual modified-source experiment (non-gating)
        run: sh scripts/run_s05c_experiment.sh
      - name: Preserve honest experiment outcome and inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s05c-experiment-${{ github.sha }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/s05c-experiment/experiment-status.json
            ${{ runner.temp }}/s05c-experiment/out
            ${{ runner.temp }}/s05c-experiment/input/spec.json
            ${{ runner.temp }}/s05c-experiment/environment-config-id.txt
            ${{ runner.temp }}/s05c-experiment/validation.json
            ${{ runner.temp }}/s05c-rust-metadata/resolution-result.json
            ${{ runner.temp }}/s05c-rust-metadata/metadata.stdout
            ${{ runner.temp }}/s05c-rust-metadata/metadata.stderr
            ${{ runner.temp }}/s05c-rust-metadata/tree.stdout
            ${{ runner.temp }}/s05c-rust-metadata/rustc.stdout
            ${{ runner.temp }}/s05c-rebuild-evidence.tar.gz
            ${{ runner.temp }}/s05c-rust-sources.tar.gz
            docs/evidence/s05c/rust-source-manifest.json
          if-no-files-found: error

  s05d-source-experiment:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/s05-d-')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify clean isolated checkout and preserve historical evidence
        run: |
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=1 origin b93b0eeaaeabdf898a6a2f9bf35cc9c1016a3d54
          git diff --exit-code b93b0eeaaeabdf898a6a2f9bf35cc9c1016a3d54 -- docs/evidence/s05a docs/evidence/s05b docs/evidence/s05c prisma/migrations Dockerfile compose.selfhost.yaml LICENSE
      - name: Exact Rust acquisition, two controlled Cargo resolutions and 13 notice investigations
        run: python3 scripts/collect_s05d_evidence.py --out "$RUNNER_TEMP/s05d-evidence"
      - name: Preserve actual blocked or partial outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s05d-source-evidence-${{ github.sha }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/s05d-evidence/*.json
            ${{ runner.temp }}/s05d-evidence/*.txt
            ${{ runner.temp }}/s05d-evidence/*.stdout
            ${{ runner.temp }}/s05d-evidence/*.stderr
            ${{ runner.temp }}/s05d-evidence/*.toml
            ${{ runner.temp }}/s05d-evidence/*.sha256
            ${{ runner.temp }}/s05d-evidence/*.crate
            ${{ runner.temp }}/s05d-evidence/generated-Cargo.lock
          if-no-files-found: error
